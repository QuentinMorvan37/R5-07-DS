name: Q3
on:
  push:
    paths:
      - 'Q3.java'
      - '.github/workflows/Q3.yaml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Creer le fichier
        run: |
          F=Q3_archive_java.txt
          echo "Nom : MORVAN Quentin" > $F
          cat Q3.java >> $F
      - name: Commit et push
        run: |
          git config --global user.name "QuentinMorvan37"
          git config --global user.email "quentin.morvan@etu.univ-lehavre.fr"
          git add Q3_archive_java.txt
          git commit -m "Q3 archive" || echo "rien de nouveau"
          git pull --rebase
          git push
